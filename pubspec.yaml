name: kimi
description: Sovereign Waqf Explorer Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (required for AppBar/TextField on web)
  flutter_localizations:
    sdk: flutter

  # State Management (Legacy StateNotifier as requested)
  flutter_riverpod: ^2.4.0
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^12.0.0

  # Maps
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  proj4dart: ^2.1.0

  # Backend
  supabase_flutter: ^2.0.0
  flutter_dotenv: ^5.1.0

  # Utils
  intl: ^0.20.2
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/batch_f_v0_39_real_locator_pilot_intake_template.csv
    - assets/images/home/
    - assets/images/basemaps/
